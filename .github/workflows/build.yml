name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Build Script
        run: bash build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: SpyApp/app/build/outputs/apk/debug/app-debug.apk
